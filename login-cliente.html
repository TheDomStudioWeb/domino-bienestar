<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="demo/boot.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de socios | DOMino Bienestar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="hub.css">
    <link rel="manifest" href="manifest.json">
<style>
  /* Ingreso líquido DOMino (dom-login.js) con los colores de la marca */
  #dl-host .dl{--dl-pill-a:#f3dc8f;--dl-pill-b:#c99a2e;--dl-pill-tx:#14110a;--dl-field:#141416;--dl-field-bd:rgba(212,175,55,.18);--dl-tx:#f2efe6;--dl-mut:#a8a396;--dl-accent:#d4af37;--dl-ok:#4CC38A;--dl-bad:#FF6B61;font-family:Montserrat,sans-serif}
  #dl-host{margin:6px 0 2px}
</style>
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh;">
    <div style="width: 100%; max-width: 420px; padding: 20px;">
        
        <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 40px;">
            <img src="imagenes/logo.png" alt="DOMino" style="height: 70px;">
        </div>

        <div class="upload-card">
            <h3 style="text-align: center; margin-bottom: 5px;">Bienvenido</h3>
            <p style="text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 25px;">Portal de socios</p>
            
            <div id="dl-host"></div>

        <p style="text-align: center; margin-top: 15px; font-size: 0.85rem;">
    <a href="#" id="link-recuperar" style="color: var(--text-muted);">¿Olvidaste tu contraseña?</a>
    <p style="color: var(--text-muted); font-size: .8rem; margin-top: 12px; line-height: 1.4;">¿Primera vez? Revise su correo: el centro le envió un mensaje para crear su clave.</p>
</p>
        </div>

        <p style="text-align: center; color: var(--text-muted); font-size: 0.75rem; margin-top: 20px;">
            DOMino © 2026 · The DOM Studio Web
        </p>
    </div>
    <script src="dom-login.js"></script>
    <script type="module" src="login-cliente.js"></script>
</body>
</html>

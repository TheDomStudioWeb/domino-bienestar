<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reservar turno</title><meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Montserrat:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0A0A0A;--pn:#16181C;--pn2:#1d2026;--tx:#F4F1EA;--mut:#b9b4a4;--gold:#D4AF37;--line:#2c2f36;--ok:#4CC38A;--err:#FF6B61}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 Montserrat,system-ui,sans-serif;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left))}
.w{max-width:560px;margin:0 auto;padding:20px 0 40px}
header{text-align:center;padding:8px 0 18px;border-bottom:1px solid var(--line);margin-bottom:18px}
header h1{font:700 22px Cinzel,serif;letter-spacing:.04em;margin:0;color:var(--gold)}header p{margin:4px 0 0;color:var(--mut);font-size:15px}
.pasos{display:flex;gap:6px;margin:0 0 18px}.pasos i{flex:1;height:4px;background:var(--line);border-radius:2px}.pasos i.on{background:var(--gold)}
h2{font:600 20px Cinzel,serif;margin:0 0 12px}
.lista{display:grid;gap:10px}
.op{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;background:var(--pn);color:var(--tx);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:4px;padding:16px;font:inherit;min-height:60px;cursor:pointer}
.op small{color:var(--mut);display:block;font-size:14px}.op:active,.op:focus-visible{background:var(--pn2);outline:2px solid var(--gold)}
.dias{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scroll-snap-type:x proximity}
.dia{flex:0 0 74px;scroll-snap-align:start;background:var(--pn);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:10px 4px;text-align:center;font:inherit;cursor:pointer;min-height:68px}
.dia b{display:block;font-size:20px}.dia span{font-size:13px;color:var(--mut);text-transform:uppercase}.dia[aria-pressed=true]{border-color:var(--gold);background:var(--pn2);outline:1px solid var(--gold)}
.hs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}.h{background:var(--pn);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:14px 0;font:600 17px Montserrat;cursor:pointer;min-height:50px}.h[aria-pressed=true]{background:var(--gold);color:#0A0A0A;border-color:var(--gold)}
.prof{margin:16px 0 8px;background:var(--pn2);color:var(--tx);border-left:6px solid var(--c,var(--gold));border-radius:3px;padding:10px 14px;font:700 17px Montserrat;display:flex;align-items:center;gap:10px}.prof i{width:14px;height:14px;border-radius:50%;background:var(--c,var(--gold));flex:0 0 14px}
label{display:block;margin:14px 0 6px;font-weight:600;font-size:15px}
input,select,textarea{width:100%;background:var(--pn);color:var(--tx);border:1px solid var(--line);border-radius:4px;padding:14px;font:inherit;min-height:52px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
.chk{display:flex;gap:12px;align-items:flex-start;margin-top:18px;font-weight:400;font-size:15px}.chk input{width:26px;height:26px;min-height:0;flex:0 0 26px;accent-color:var(--gold)}
.btn{display:block;width:100%;background:var(--gold);color:#0A0A0A;border:0;border-radius:4px;padding:16px;font:700 17px Montserrat;margin-top:20px;cursor:pointer;min-height:56px;text-transform:uppercase;letter-spacing:.05em}.btn:disabled{opacity:.45}
.sec{background:none;color:var(--tx);border:1px solid var(--line);margin-top:10px}
.volver{background:none;border:0;color:var(--gold);font:600 16px Montserrat;padding:10px 0;cursor:pointer;margin-bottom:6px;min-height:44px}
.err{border-left:3px solid var(--err);background:var(--pn);padding:12px 14px;margin:14px 0;color:var(--tx);border-radius:3px}.err b{color:var(--err)}
.ok{border:1px solid var(--ok);border-radius:4px;background:var(--pn);padding:18px;margin:6px 0 14px}.ok h2{color:var(--ok)}
.res{background:var(--pn);border:1px solid var(--line);border-radius:4px;padding:14px;margin:10px 0}.res div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}.res div:last-child{border:0}.res span{color:var(--mut)}
.link{word-break:break-all;background:var(--bg);border:1px dashed var(--line);padding:10px;border-radius:3px;font-size:14px;color:var(--gold)}
.cargando{color:var(--mut);padding:30px 0;text-align:center}
.hp{position:absolute;left:-9999px;opacity:0;height:0}
footer{text-align:center;color:var(--mut);font-size:12.5px;padding:24px 0 8px;border-top:1px solid var(--line);margin-top:30px}
@media(min-width:480px){.hs{grid-template-columns:repeat(4,1fr)}}
</style></head><body><div class="w">
<header><h1 id="neg">Reservar turno</h1><p id="sub">&nbsp;</p></header>
<div class="pasos" id="pasos" hidden><i></i><i></i><i></i></div>
<main id="m" aria-live="polite"><div class="cargando">Cargando…</div></main>
<footer>Desarrollado por The DOM Studio Web · WhatsApp 261-3431216 · thedomstudioweb@gmail.com</footer>
</div>
<script src="config.js"></script>
<script type="module">
import { llamar, msg } from './api.js';
const $ = s => document.querySelector(s), M = $('#m');
const E = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DS = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
const S = { cfg: null, paso: 0, serv: null, dias: [], fecha: null, rec: null, hora: null, enviando: false };
const dow = f => new Date(f + 'T00:00:00Z').getUTCDay(), dd = f => f.slice(8), larga = f => `${DS[dow(f)]} ${+f.slice(8)}/${+f.slice(5, 7)}`;
const hoyLocal = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
function pasos(n) { const p = $('#pasos'); p.hidden = n === 0; [...p.children].forEach((e, i) => e.classList.toggle('on', i < n)); }
function ir(n, push = true) { S.paso = n; if (push) history.pushState({ n }, ''); dibujar(); window.scrollTo(0, 0); }
addEventListener('popstate', e => { S.paso = (e.state && e.state.n) || 0; dibujar(); });
const err = e => `<div class="err" role="alert"><b>No se pudo.</b> ${E(msg(e))}</div>`;

async function iniciar() {
  const cod = new URLSearchParams(location.search).get('c');
  const r = await llamar('inicio');
  if (!r.ok) { M.innerHTML = err(r.error) + '<button class="btn" onclick="location.reload()">Reintentar</button>'; return; }
  S.cfg = r; S.pre = r.horarios || {}; S.preT = Date.now(); $('#neg').textContent = r.negocio.nombre; document.title = 'Reservar turno · ' + r.negocio.nombre;
  $('#sub').textContent = r.negocio.modo_reserva === 'solicitud' ? 'Envíe su solicitud y le confirmamos el turno' : 'Reserve su turno';
  history.replaceState({ n: 0 }, '');
  if (cod) return gestionar(cod);
  dibujar();
}
function dibujar() { ([pServicio, pHorario, pDatos][S.paso] || pServicio)(); }

function pServicio() {
  pasos(1);
  M.innerHTML = `<h2>¿Qué necesita?</h2><div class="lista">${S.cfg.servicios.map(s => `<button class="op" data-s="${E(s.id)}"><span>${E(s.nombre)}<small>${s.duracion_min} min</small></span><span aria-hidden="true">›</span></button>`).join('')}</div>`;
  M.querySelectorAll('.op').forEach(b => b.onclick = () => { S.serv = S.cfg.servicios.find(s => s.id === b.dataset.s); S.fecha = S.hora = S.rec = null; S.dias = []; ir(1); });
}
async function pHorario() {
  pasos(2);
  M.innerHTML = `<button class="volver" id="v">‹ Volver</button><h2>${E(S.serv.nombre)}</h2><div class="cargando">Buscando horarios…</div>`;
  $('#v').onclick = () => history.back();
  if (!S.dias.length && S.pre[S.serv.id] && Date.now() - S.preT < 120000) S.dias = S.pre[S.serv.id];
  if (!S.dias.length) {
    const r = await llamar('horarios_libres', { servicio_id: S.serv.id, desde: hoyLocal(), dias: Math.min(S.cfg.negocio.ventana_dias, 21) });
    if (!r.ok) { M.innerHTML = `<button class="volver" id="v">‹ Volver</button>` + err(r.error); $('#v').onclick = () => history.back(); return; }
    S.dias = r.dias;
  }
  if (!S.dias.length) { M.innerHTML = `<button class="volver" id="v">‹ Volver</button><h2>${E(S.serv.nombre)}</h2><p>No hay horarios disponibles en los próximos días. Llámenos${S.cfg.negocio.telefono ? ' al <b>' + E(S.cfg.negocio.telefono) + '</b>' : ''}.</p>`; $('#v').onclick = () => history.back(); return; }
  if (!S.fecha) S.fecha = S.dias[0].fecha;
  const nom = id => (S.cfg.recursos.find(r => r.id === id) || {}).nombre || id;
  const dia = S.dias.find(d => d.fecha === S.fecha);
  M.innerHTML = `<button class="volver" id="v">‹ Volver</button><h2>${E(S.serv.nombre)}</h2><p style="margin:0 0 8px;color:var(--mut)">Elija el día</p>
  <div class="dias" role="group">${S.dias.map(d => `<button class="dia" data-f="${d.fecha}" aria-pressed="${d.fecha === S.fecha}"><span>${DS[dow(d.fecha)]}</span><b>${dd(d.fecha)}</b><span>${['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'][+d.fecha.slice(5, 7) - 1]}</span></button>`).join('')}</div>
  <p style="margin:6px 0 0;color:var(--mut)">Elija la hora</p>
  ${Object.entries(dia.recursos).map(([r, hs]) => `<div class="prof" style="--c:${E(((S.cfg.recursos.find(x => x.id === r) || {}).color) || '#D4AF37')}"><i></i>${E(nom(r))}</div><div class="hs">${hs.map(h => `<button class="h" data-r="${E(r)}" data-h="${h}" aria-pressed="${S.rec === r && S.hora === h}">${h}${dia.lugares && dia.lugares[r] && dia.lugares[r][h] != null ? `<small style="display:block;font-size:.72em;opacity:.8">${dia.lugares[r][h] === 1 ? 'queda 1 lugar' : dia.lugares[r][h] + ' lugares'}</small>` : ''}</button>`).join('')}</div>`).join('')}
  <button class="btn" id="sig" ${S.hora ? '' : 'disabled'}>Continuar</button>`;
  $('#v').onclick = () => history.back();
  M.querySelectorAll('.dia').forEach(b => b.onclick = () => { S.fecha = b.dataset.f; S.rec = S.hora = null; pHorario(); });
  M.querySelectorAll('.h').forEach(b => b.onclick = () => { S.rec = b.dataset.r; S.hora = b.dataset.h; M.querySelectorAll('.h').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#sig').disabled = false; });
  $('#sig').onclick = () => ir(2);
}
function pDatos() {
  pasos(3);
  const esVet = S.cfg.negocio.rubro === 'veterinaria';
  const nom = (S.cfg.recursos.find(r => r.id === S.rec) || {}).nombre;
  M.innerHTML = `<button class="volver" id="v">‹ Volver</button><h2>Sus datos</h2>
  <div class="res"><div><span>Servicio</span><b>${E(S.serv.nombre)}</b></div><div><span>Día y hora</span><b>${larga(S.fecha)} · ${S.hora}</b></div><div><span>Con</span><b>${E(nom)}</b></div></div>
  <form id="f" novalidate autocomplete="on">
  <label for="n">Su nombre y apellido</label><input id="n" name="name" autocomplete="name" required maxlength="80">
  <label for="t">Teléfono (WhatsApp)</label><input id="t" name="tel" type="tel" inputmode="tel" autocomplete="tel" required maxlength="20">
  <label for="e">Correo (opcional, para avisarle)</label><input id="e" name="email" type="email" autocomplete="email" maxlength="80">
  ${esVet ? `<label for="mas">Nombre de la mascota</label><input id="mas" maxlength="60"><label for="tp">Tipo</label><select id="tp"><option>Perro</option><option>Gato</option><option>Otro</option></select>` : ''}
  <label for="o">Comentario (opcional)</label><textarea id="o" rows="2" maxlength="300"></textarea>
  <input class="hp" id="web" tabindex="-1" autocomplete="off" aria-hidden="true">
  <label class="chk"><input type="checkbox" id="c"><span>Autorizo que me contacten por este turno (llamada, WhatsApp o correo).</span></label>
  <div id="er"></div>
  <button class="btn" id="go" type="submit">${S.cfg.negocio.modo_reserva === 'solicitud' ? 'Enviar solicitud' : 'Reservar turno'}</button></form>`;
  $('#v').onclick = () => history.back();
  $('#f').onsubmit = async ev => {
    ev.preventDefault(); if (S.enviando) return; $('#er').innerHTML = '';
    const d = { servicio_id: S.serv.id, recurso_id: S.rec, fecha: S.fecha, hora: S.hora, nombre: $('#n').value, tel: $('#t').value, email: $('#e').value, sujeto_nombre: esVet ? $('#mas').value : '', sujeto_tipo: esVet ? $('#tp').value : '', nota: $('#o').value, web: $('#web').value, consentimiento: $('#c').checked };
    S.enviando = true; $('#go').disabled = true; $('#go').textContent = 'Enviando…';
    const r = await llamar('reservar', d); S.enviando = false;
    if (!r.ok) { if (r.error === 'horario_ocupado' || r.error === 'fuera_de_horario') { S.dias = []; S.pre = {}; S.hora = S.rec = null; S.paso = 1; history.replaceState({ n: 1 }, ''); await pHorario(); M.insertAdjacentHTML('afterbegin', err(r.error)); return; } $('#er').innerHTML = err(r.error); $('#er').scrollIntoView({ block: 'center' }); $('#go').disabled = false; $('#go').textContent = S.cfg.negocio.modo_reserva === 'solicitud' ? 'Enviar solicitud' : 'Reservar turno'; return; }
    S.listo = r; const url = location.origin + location.pathname + '?c=' + r.codigo;
    history.replaceState({ n: 0 }, ''); pasos(0);
    M.innerHTML = `<div class="ok"><h2>${r.estado === 'Confirmado' ? '¡Turno reservado!' : '¡Solicitud enviada!'}</h2><p style="margin:0">${larga(r.fecha)} a las <b>${r.hora}</b>.${r.estado === 'Por confirmar' ? ' Le confirmaremos por teléfono o WhatsApp.' : ''}</p></div>
    <p><b>Guarde este enlace</b> para ver o cancelar su turno:</p><div class="link">${E(url)}</div>
    <button class="btn sec" id="cp">Copiar enlace</button><button class="btn sec" id="otro">Pedir otro turno</button>`;
    $('#cp').onclick = async () => { try { await navigator.clipboard.writeText(url); $('#cp').textContent = '¡Copiado!'; } catch (x) { const r = document.createRange(); r.selectNodeContents(document.querySelector('.link')); getSelection().removeAllRanges(); getSelection().addRange(r); $('#cp').textContent = 'Seleccionado: copie el enlace'; } };
    $('#otro').onclick = () => { history.replaceState({ n: 0 }, '', location.pathname); S.dias = []; S.serv = S.fecha = S.hora = S.rec = null; ir(0, false); };
  };
}
async function gestionar(cod) {
  pasos(0); M.innerHTML = '<div class="cargando">Buscando su turno…</div>';
  const r = await llamar('ver_turno', { codigo: cod });
  if (!r.ok) { M.innerHTML = err(r.error); return; }
  const t = r.turno, est = { 'Por confirmar': 'Pendiente de confirmación', Confirmado: 'Confirmado', 'En sala': 'En atención', Atendido: 'Atendido', Cancelado: 'Cancelado', 'No vino': 'No asistió', Reprogramado: 'Reprogramado' }[t.estado] || t.estado;
  M.innerHTML = `<h2>Su turno</h2><div class="res"><div><span>Estado</span><b>${E(est)}</b></div><div><span>Día y hora</span><b>${larga(t.fecha)} · ${E(t.hora)}</b></div><div><span>Servicio</span><b>${E(t.servicio)}</b></div><div><span>Con</span><b>${E(t.profesional)}</b></div>${t.sujeto ? `<div><span>Mascota</span><b>${E(t.sujeto)}</b></div>` : ''}</div>
  ${t.puede_cancelar ? '<button class="btn sec" id="can">Cancelar este turno</button>' : `<p style="color:var(--mut)">Para cambiar o cancelar este turno, comuníquese con ${E(r.negocio.nombre)}${r.negocio.telefono ? ' al ' + E(r.negocio.telefono) : ''}.</p>`}`;
  const c = $('#can'); if (!c) return;
  c.onclick = () => { c.outerHTML = '<div class="err"><b>¿Cancelar el turno?</b> Esta acción libera el horario.</div><button class="btn" id="si">Sí, cancelar</button><button class="btn sec" id="no">No, mantenerlo</button>'; $('#no').onclick = () => gestionar(cod); $('#si').onclick = async () => { $('#si').disabled = true; const x = await llamar('cancelar_turno', { codigo: cod }); if (!x.ok) { M.insertAdjacentHTML('afterbegin', err(x.error)); return; } M.innerHTML = '<div class="ok"><h2>Turno cancelado</h2><p style="margin:0">El horario quedó libre. Gracias por avisar.</p></div>'; }; };
}
iniciar();
</script></body></html>

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Alta de centros · DOMino Bienestar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0A0A;--panel:#16181C;--tx:#F4F1EA;--mut:#B9B4A8;--or:#D4AF37;--ok:#4CC38A;--er:#FF6B61;--fil:#3a3322}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.5 Montserrat,system-ui,sans-serif;padding:0 16px 40px}
main{max-width:640px;margin:0 auto}
h1{font:600 22px Cinzel,serif;color:var(--or);margin:24px 0 4px}h2{font:600 17px Cinzel,serif;color:var(--or);margin:0 0 12px}
p{color:var(--mut);margin:0 0 12px}
section{background:var(--panel);border:1px solid var(--fil);border-radius:6px;padding:16px;margin:16px 0}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;min-height:46px;background:var(--bg);color:var(--tx);border:1px solid var(--fil);border-radius:4px;padding:10px 12px;font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:2px}
button{min-height:46px;border:0;border-radius:4px;background:var(--or);color:#0A0A0A;font:600 15px Montserrat,sans-serif;padding:0 18px;cursor:pointer}
button.sec{background:transparent;color:var(--or);border:1px solid var(--or)}button:disabled{opacity:.5;cursor:wait}
.fila{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.dos{grid-template-columns:1fr}}
.msg{margin-top:12px;font-size:14px;white-space:pre-wrap}.msg.ok{color:var(--ok)}.msg.er{color:var(--er)}
.neg{border-top:1px solid var(--fil);padding:12px 0}.neg:first-child{border-top:0}.neg b{color:var(--tx)}.neg small{color:var(--mut);display:block}
.tag{display:inline-block;border:1px solid var(--or);color:var(--or);border-radius:3px;padding:0 8px;font-size:12px;margin-left:6px}.tag.activo{border-color:var(--ok);color:var(--ok)}.tag.suspendido{border-color:var(--er);color:var(--er)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Alta de centros</h1>
<p>Herramienta interna de The DOM Studio Web. Solo entran las cuentas cargadas como superadmin.</p>

<section id="s-login">
  <h2>Ingresar</h2>
  <label for="l-em">Correo</label><input id="l-em" type="email" autocomplete="username" inputmode="email">
  <label for="l-cl">Clave</label><input id="l-cl" type="password" autocomplete="current-password">
  <div class="fila"><button id="l-go">Ingresar</button></div><div class="msg er" id="l-er" role="alert"></div>
</section>

<div id="s-app" hidden>
  <section>
    <h2>Nuevo centro</h2>
    <label for="n-nom">Nombre del centro</label><input id="n-nom" placeholder="Ej.: Gimnasio Cumbre" autocomplete="off">
    <label for="n-id">Identificador (aparece en los enlaces)</label><input id="n-id" placeholder="gimnasio-cumbre" autocomplete="off" autocapitalize="none">
    <div class="dos"><div><label for="n-pn">Nombre del propietario</label><input id="n-pn" autocomplete="off"></div><div><label for="n-pa">Apellido</label><input id="n-pa" autocomplete="off"></div></div>
    <label for="n-em">Correo del propietario</label><input id="n-em" type="email" inputmode="email" autocomplete="off">
    <label for="n-cl">Clave temporal (mínimo 8 caracteres)</label><input id="n-cl" type="text" autocomplete="off" autocapitalize="none">
    <label for="n-dias">Días de prueba desde su primer ingreso</label><input id="n-dias" type="number" min="1" max="7" value="7">
    <div class="fila"><button id="n-go">Crear centro y usuario</button></div>
    <div class="msg" id="n-msg" role="status"></div>
  </section>
  <section>
    <h2>Centros</h2><div id="lista">Cargando…</div>
    <div class="fila"><button class="sec" id="salir">Salir</button></div>
  </section>
</div>
</main>

<script src="../turnos/config.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, getDocs, collection, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const CFG = { apiKey: "AIzaSyB0y7cFZ-HnGrasLsg-HTeWXvenZSZzSpQ", authDomain: "domino-bienestar.firebaseapp.com", projectId: "domino-bienestar", storageBucket: "domino-bienestar.firebasestorage.app", messagingSenderId: "68194219142", appId: "1:68194219142:web:cf68e1a910584c963f4d07" };
const app = initializeApp(CFG, 'centros'), au = getAuth(app)  /* app con nombre propio: su sesión no se mezcla con la del Hub abierto en otra pestaña */, db = getFirestore(app), $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);
const msg = (t, k) => { const m = $('n-msg'); m.textContent = t; m.className = 'msg ' + (k || ''); };
let idAuto = true;
$('n-nom').oninput = () => { if (idAuto) $('n-id').value = slug($('n-nom').value); };
$('n-id').oninput = () => { idAuto = false; };

$('l-go').onclick = async () => {
  $('l-er').textContent = ''; $('l-go').disabled = true;
  try { await signInWithEmailAndPassword(au, $('l-em').value.trim(), $('l-cl').value); }
  catch (e) { $('l-er').textContent = 'Correo o clave incorrectos.'; }
  $('l-go').disabled = false;
};
$('salir').onclick = () => signOut(au);
onAuthStateChanged(au, async u => {
  if (!u) { $('s-login').hidden = false; $('s-app').hidden = true; return; }
  let es = false; try { es = (await getDoc(doc(db, 'superadmins', u.email.toLowerCase()))).exists(); } catch (e) {}
  if (!es) { $('l-er').textContent = 'Esta cuenta no es de superadmin.'; await signOut(au); return; }
  $('s-login').hidden = true; $('s-app').hidden = false; listar();
});

async function listar() {
  const z = $('lista');
  try {
    const s = await getDocs(collection(db, 'negocios')), f = [];
    s.forEach(d => f.push({ id: d.id, ...d.data() }));
    f.sort((a, b) => String(a.nombre).localeCompare(String(b.nombre)));
    if (!f.length) { z.textContent = 'Todavía no hay centros.'; return; }
    z.innerHTML = f.map(n => {
      const v = n.vence && n.vence.toDate ? n.vence.toDate() : null, vencido = n.estado === 'prueba' && v && v < new Date();
      const det = n.estado === 'prueba' ? (v ? (vencido ? 'Prueba vencida el ' : 'Prueba hasta el ') + v.toLocaleDateString('es-AR') : 'Prueba sin iniciar (empieza en su primer ingreso)') : '';
      return `<div class="neg"><b>${esc(n.nombre || n.id)}</b><span class="tag ${esc(n.estado)}">${esc(n.estado)}</span><small>${esc(n.id)}${det ? ' · ' + esc(det) : ''}</small>
        <div class="fila" style="margin-top:8px">${n.estado !== 'activo' ? `<button class="sec" data-a="activo" data-id="${esc(n.id)}">Pasar a activo</button>` : ''}${n.estado !== 'suspendido' ? `<button class="sec" data-a="suspendido" data-id="${esc(n.id)}">Suspender</button>` : ''}${n.estado === 'prueba' ? `<button class="sec" data-a="extender" data-id="${esc(n.id)}">Cambiar plazo</button>` : ''}</div></div>`;
    }).join('');
  } catch (e) { z.textContent = 'No se pudo leer la lista (' + (e.code || e.message) + ').'; }
}
$('lista').onclick = async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return; b.disabled = true;
  try {
    const ref = doc(db, 'negocios', b.dataset.id), a = b.dataset.a;
    if (a === 'extender') {
      const t = prompt('¿Cuántos días de prueba le quedan a partir de hoy? (1 a 90)', '14'); if (t === null) { b.disabled = false; return; }
      const d = Math.floor(Number(t)); if (!(d >= 1 && d <= 90)) { alert('Escriba un número de 1 a 90.'); b.disabled = false; return; }
      await updateDoc(ref, { vence: new Date(Date.now() + d * 86400000) });
    } else await updateDoc(ref, { estado: a });
  } catch (err) { alert('No se pudo cambiar (' + (err.code || err.message) + ').'); }
  listar();
};

$('n-go').onclick = async () => {
  const nom = $('n-nom').value.trim(), nid = slug($('n-id').value), pn = $('n-pn').value.trim(), pa = $('n-pa').value.trim(), em = $('n-em').value.trim().toLowerCase(), cl = $('n-cl').value, dias = Math.max(1, Math.min(7, Number($('n-dias').value) || 7));
  if (nom.length < 2 || nid.length < 3) return msg('Falta el nombre del centro o el identificador (mínimo 3 letras).', 'er');
  if (!pn || !pa || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)) return msg('Faltan nombre, apellido o un correo válido del propietario.', 'er');
  if (cl.length < 8) return msg('La clave temporal necesita al menos 8 caracteres.', 'er');
  $('n-go').disabled = true; const pasos = [];
  try {
    msg('1/4 Creando la planilla de turnos del centro…');
    const tok = await au.currentUser.getIdToken(true);
    const r = await fetch(window.TURNOS_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ accion: 'crear_negocio', id_token: tok, nid, nombre: nom }), redirect: 'follow' }).then(x => x.json());
    if (!r.ok) throw new Error('La agenda respondió: ' + (r.error || 'error')); pasos.push(r.existente ? 'Planilla ya existía.' : 'Planilla de turnos creada.');
    msg('2/4 Registrando el centro…');
    const ref = doc(db, 'negocios', nid), ya = await getDoc(ref);
    if (!ya.exists()) await setDoc(ref, { nombre: nom, estado: 'prueba', vence: null, dias_prueba: dias, creado: serverTimestamp() }); pasos.push(ya.exists() ? 'Centro ya registrado.' : 'Centro registrado en prueba de ' + dias + ' días.');
    msg('3/4 Creando la cuenta del propietario…');
    const sec = initializeApp(CFG, 'sec' + Date.now()), sa = getAuth(sec);
    try { await createUserWithEmailAndPassword(sa, em, cl); pasos.push('Cuenta creada.'); }
    catch (e) { if (e.code === 'auth/email-already-in-use') pasos.push('Ese correo ya tenía cuenta: conserva su clave.'); else throw e; }
    await signOut(sa);
    msg('4/4 Dando el permiso de Dirección…');
    await setDoc(doc(db, 'users', em), { email: em, nombre_display: pn + ' ' + pa, rol_jerarquia: 'senior', activo: true, negocio_id: nid, creado: serverTimestamp() }); pasos.push('Permiso de Dirección cargado.');
    msg('Listo.\n' + pasos.join('\n') + '\n\nPara pasarle al propietario:\n• Dirección: ' + location.origin + '/\n• Correo: ' + em + '\n• Clave temporal: ' + cl + '\n• Prueba: ' + dias + ' días desde su primer ingreso.', 'ok');
    ['n-nom', 'n-id', 'n-pn', 'n-pa', 'n-em', 'n-cl'].forEach(i => $(i).value = ''); idAuto = true; listar();
  } catch (e) { msg('No se pudo completar: ' + (e.message || e.code) + (pasos.length ? '\nYa hecho: ' + pasos.join(' ') + ' (se puede repetir sin duplicar).' : ''), 'er'); }
  $('n-go').disabled = false;
};
</script>
</body>
</html>
